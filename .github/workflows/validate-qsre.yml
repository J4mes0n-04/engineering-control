name: Validate QSRE environment

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qsre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Run environment doctor
        shell: pwsh
        run: ./scripts/doctor.ps1
      - name: Validate QSRE repository and control pin
        shell: pwsh
        run: ./scripts/validate-repository.ps1
